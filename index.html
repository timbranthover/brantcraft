<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Estate // WebGPU Study</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#22374d,#07101a 72%);z-index:10;transition:opacity .45s}#loading.done{opacity:0;pointer-events:none}.card{width:min(620px,86vw);text-align:center;text-shadow:0 2px 16px #000}.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.62;margin-bottom:10px}.title{font-size:clamp(28px,5vw,58px);font-weight:600;letter-spacing:-.04em}.sub{font-size:13px;line-height:1.45;opacity:.65;margin-top:10px}.bar{height:2px;background:#ffffff1f;margin:24px auto 0;max-width:360px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:white;transition:width .25s}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-shadow:0 1px 5px #0009;opacity:.85}.bottom{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;text-shadow:0 1px 6px #000;white-space:nowrap}#crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);opacity:.55}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff9}#crosshair:before{width:8px;height:1px;left:0;top:3.5px}#crosshair:after{height:8px;width:1px;top:0;left:3.5px}#mobile{display:none;position:fixed;inset:0;pointer-events:none}.stick{position:absolute;width:118px;height:118px;border:1px solid #ffffff26;border-radius:50%;background:#ffffff08;backdrop-filter:blur(5px);pointer-events:auto}.nub{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#ffffff25;border:1px solid #ffffff2f}.left{left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom))}.look{right:0;top:0;width:56%;height:100%;position:absolute;pointer-events:auto}.run{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:1px solid #ffffff29;background:#ffffff12;color:white;pointer-events:auto;font-size:10px;letter-spacing:.08em}.jump{position:absolute;right:max(95px,env(safe-area-inset-right));bottom:max(34px,env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:1px solid #ffffff21;background:#ffffff0e;color:white;pointer-events:auto;font-size:9px;letter-spacing:.06em}#fallback{position:fixed;inset:0;display:none;place-items:center;background:#09111a;z-index:30;padding:32px;text-align:center}@media (pointer:coarse){#mobile{display:block}.bottom{display:none}#crosshair{opacity:.35}}
</style>
</head>
<body>
<canvas id="gfx"></canvas>
<div id="loading"><div class="card"><div class="eyebrow">direct webgpu / wgsl</div><div class="title">MEDITERRANEAN ESTATE</div><div class="sub">Building renderer · compiling shaders · placing estate geometry</div><div class="bar"><i id="progress"></i></div></div></div>
<div id="fallback"><div><h2>WebGPU required</h2><p>This build uses direct WebGPU. Open it in a recent Safari, Chrome, or Edge with WebGPU enabled.</p></div></div>
<div id="hud"><div class="top"><span id="fps">-- FPS</span><br>ESTATE BUILD 0.1</div><div id="crosshair"></div><div class="bottom">WASD move · mouse look · shift sprint · space jump</div></div>
<div id="mobile"><div class="stick left" id="moveStick"><div class="nub"></div></div><div class="look" id="lookZone"></div><button class="run" id="runBtn">RUN</button><button class="jump" id="jumpBtn">JUMP</button></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
