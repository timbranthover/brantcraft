let vel=new T.Vector3,dir=new T.Vector3,right=new T.Vector3,bob=0;function frame(){let dt=Math.min(clock.getDelta(),.04),time=clock.elapsedTime,f=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0),s=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);if(coarse){f-=sy;s+=sx}let moving=Math.abs(f)+Math.abs(s)>.05,sp=(keys.has('ShiftLeft')||sprinting)?7.1:4.2;camera.getWorldDirection(dir);dir.y=0;dir.normalize();right.crossVectors(dir,camera.up).normalize();let wish=new T.Vector3().addScaledVector(dir,f).addScaledVector(right,s);if(wish.lengthSq()>1)wish.normalize();vel.x=T.MathUtils.damp(vel.x,wish.x*sp,10,dt);vel.z=T.MathUtils.damp(vel.z,wish.z*sp,10,dt);camera.position.x+=vel.x*dt;camera.position.z+=vel.z*dt;camera.position.z=T.MathUtils.clamp(camera.position.z,-110,22);let hw=half(camera.position.z)-1.2;camera.position.x=T.MathUtils.clamp(camera.position.x,-hw,hw);let y=gh(camera.position.x,camera.position.z),eye=y+1.72;if(-y>1.1)eye=.9+Math.sin(time*2)*.04;else if(moving){bob+=dt*8;eye+=Math.sin(bob)*.025}camera.position.y=T.MathUtils.damp(camera.position.y,eye,12,dt);people.forEach(g=>g.position.y=g.userData.y+Math.sin(time*1.35+g.userData.p)*.03);renderer.render(scene,camera)}renderer.setAnimationLoop(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,coarse?1.35:2));renderer.setSize(innerWidth,innerHeight)});</script></body></html>
